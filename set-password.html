<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ao.css">
    <link rel="stylesheet" href="csign.css">
    <link rel="icon" href="school.png">
    <title>Set Password</title>
</head>
<body>
    <div class="navbar">
        <ul>
            <div>
                <li><a href="about.html"><img src="school.png"></a></li>
                <li class="title" style="color: white; text-align: left;">
                    <a style="font-weight: bolder; font-size: xx-large;">SCHOOP</a>
                    <a style="padding:0;margin:0; font-size: large;">SHSSN3 School Portal</a>
                </li>
            </div>
        </ul>
    </div>

    <div class="csign">
        <div class="boxin">
            <div class="right-side" style="padding: 20px;">
                <div style="justify-content: center;">
                    <h1 style="padding-bottom: 20px;">Set Your Password</h1>
                    <form id="setPasswordForm">
                        <input type="hidden" id="userinfo" name="userinfo"> <!-- Hidden input for user ID -->
                        <input type="password" id="newPassword" name="newPassword" placeholder="New Password" required><br>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required><br>
                        <button type="submit">Set Password</button>
                    </form>
                    <p id="passwordError" style="color: red;"></p> <!-- Error message placeholder -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get user info from URL query parameter
        const params = new URLSearchParams(window.location.search);
        const userinfo = params.get("userinfo");
        document.getElementById("userinfo").value = userinfo;

        document.getElementById("setPasswordForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const passwordError = document.getElementById("passwordError");

            if (newPassword !== confirmPassword) {
                passwordError.textContent = "Passwords do not match.";
                return;
            }

            fetch("backend/set_password.php", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `userinfo=${encodeURIComponent(userinfo)}&newPassword=${encodeURIComponent(newPassword)}`,
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = "index.html"; // Redirect after setting password
                } else {
                    passwordError.textContent = data.message;
                }
            })
            .catch(error => {
                console.error("Error:", error);
                passwordError.textContent = "An error occurred. Please try again.";
            });
        });
    </script>
</body>
</html>
